name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: doas pkg install -y phpunit11-php84

      - name: Syntax check
        run: |
          find classes/ tools/ bin/ system/ libraries/ -name '*.php' -exec php -l {} \; | grep -v "No syntax errors" && exit 1 || true

      - name: Run tests
        run: phpunit

      # tools/list size gate: fails when the serialized tool catalog exceeds
      # tests/tools-list.budget. Byte metric only (tokenizer independent);
      # the token metric needs python3-tokenizers and is published from dev
      # machines instead. Lower a budget deliberately in the same PR that
      # shrinks the catalog; never raise it without a plan/issue reference.
      - name: tools/list budget
        run: php tests/measure-tools-list.php --check
